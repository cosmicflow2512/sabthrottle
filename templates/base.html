<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}sabthrottle{% endblock %}</title>
  <style>
    :root {
      --bg:#0f172a; --bg2:#1e293b; --fg:#e2e8f0; --muted:#94a3b8;
      --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
      --border:#334155;
    }
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
    header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    header h1{margin:0;font-size:18px;font-weight:600}
    nav a{color:var(--muted);text-decoration:none;margin-right:16px;padding:6px 10px;border-radius:6px}
    nav a:hover{color:var(--fg);background:rgba(255,255,255,.05)}
    nav a.active{color:var(--accent);background:rgba(56,189,248,.1)}
    main{max-width:980px;margin:24px auto;padding:0 24px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
    .card h2{margin:0 0 14px;font-size:16px;font-weight:600}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .row > *{flex:1;min-width:160px}
    label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    input[type=text],input[type=number],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);padding:8px 10px;font:inherit}
    input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
    button,.btn{background:var(--accent);color:#0f172a;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    button:hover,.btn:hover{filter:brightness(1.1)}
    .btn-secondary{background:transparent;color:var(--fg);border:1px solid var(--border)}
    .btn-danger{background:var(--bad);color:#fff}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}
    th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500}
    .pill-ok{background:rgba(34,197,94,.15);color:var(--ok)}
    .pill-warn{background:rgba(245,158,11,.15);color:var(--warn)}
    .pill-bad{background:rgba(239,68,68,.15);color:var(--bad)}
    .pill-info{background:rgba(56,189,248,.15);color:var(--accent)}
    .big{font-size:28px;font-weight:700;line-height:1.2}
    .muted{color:var(--muted)}
    .day-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none}
    .day-toggle input{margin:0}
    form .actions{display:flex;gap:8px;margin-top:16px}
    .inline-form{display:inline}
    .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
    .tabs a{padding:8px 18px;color:var(--muted);text-decoration:none;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none}
    .tabs a.active{color:var(--accent);background:var(--bg2);border-color:var(--border)}
    .tabs a:hover{color:var(--fg)}
    /* --- Tooltips: pure-CSS info icon -------------------------------- */
    .info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
      border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:11px;font-weight:700;
      font-style:normal;cursor:help;position:relative;vertical-align:middle;margin-left:6px;text-transform:none;letter-spacing:0}
    .info::after{content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
      width:280px;background:#020617;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
      color:var(--fg);font-size:12px;font-weight:400;line-height:1.5;text-align:left;white-space:normal;
      opacity:0;pointer-events:none;transition:opacity .12s;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .info::before{content:"";position:absolute;bottom:118%;left:50%;transform:translateX(-50%);
      border:6px solid transparent;border-top-color:var(--border);opacity:0;transition:opacity .12s}
    .info:hover::after,.info:hover::before,.info:focus::after,.info:focus::before{opacity:1}
    @media (max-width:640px){.info::after{left:auto;right:-8px;transform:none}}
  </style>
</head>
<body>
  <header>
    <h1>sabthrottle</h1>
    <nav>
      <a href="{{ url_for('ui_index') }}" {% if request.endpoint=='ui_index' %}class="active"{% endif %}>Status</a>
      <a href="{{ url_for('ui_rules') }}" {% if request.endpoint and request.endpoint.startswith('ui_rule') %}class="active"{% endif %}>Rules</a>
      <a href="{{ url_for('ui_settings') }}" {% if request.endpoint=='ui_settings' %}class="active"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
