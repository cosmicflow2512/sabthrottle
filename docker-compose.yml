services:
  sabthrottle:
    image: ghcr.io/cosmicflow2512/sabthrottle:latest
    container_name: sabthrottle
    restart: unless-stopped
    ports:
      - "6811:6811"
    volumes:
      - ./config:/config
    environment:
      SABNZBD_URL: "http://sabnzbd:8080"
      SABNZBD_API_KEY: "CHANGE_ME"
      JELLYFIN_URL: "http://jellyfin:8096"
      JELLYFIN_API_KEY: "CHANGE_ME"
      STREAM_BUDGET_PERCENT: "50"
      FULL_PERCENT: "100"
      # --- JDownloader 2 via MyJDownloader (optional) ---
      # MYJD_EMAIL: "you@example.com"
      # MYJD_PASSWORD: "your_myjd_password"
      # MYJD_DEVICE: "your-jd-device-name"
      # WEBHOOK_TOKEN: "optional-shared-secret"
      # NZBDAV_PATH_PREFIX: "/mnt/user/nzbdav"
      # LOG_LEVEL: "INFO"
